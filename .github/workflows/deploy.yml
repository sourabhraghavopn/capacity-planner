name: Deploy to AWS

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish to CloudFront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::518710148615:role/capacity-planner-github-deploy
          aws-region: us-east-1

      - name: Deploy
        run: npm run deploy
        env:
          AWS_REGION: us-east-1
          STACK_NAME: capacity-planner
