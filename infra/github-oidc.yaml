AWSTemplateFormatVersion: '2010-09-09'
Description: IAM role for GitHub Actions to deploy Capacity Planner to S3 + CloudFront

Parameters:
  GitHubSubPrefix:
    Type: String
    Default: repo:sourabhraghavopn@95341610/capacity-planner@1337065515
    Description: GitHub Actions OIDC sub prefix (owner@id/repo@id)

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - ffffffffffffffffffffffffffffffffffffffff

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: capacity-planner-github-deploy
      Description: Deploy Capacity Planner from GitHub Actions (master/main)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub '${GitHubSubPrefix}:ref:refs/heads/master'
                  - !Sub '${GitHubSubPrefix}:ref:refs/heads/main'
      Policies:
        - PolicyName: capacity-planner-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:UpdateStack
                Resource:
                  - !Sub arn:aws:cloudformation:us-east-1:${AWS::AccountId}:stack/capacity-planner/*
              - Sid: S3Bucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketOwnershipControls
                  - s3:ListBucket
                  - s3:PutBucketEncryption
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                Resource: arn:aws:s3:::capacity-planner-518710148615
              - Sid: S3Objects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: arn:aws:s3:::capacity-planner-518710148615/*
              - Sid: CloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateFunction
                  - cloudfront:CreateInvalidation
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:DescribeFunction
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:GetFunction
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:ListTagsForResource
                  - cloudfront:PublishFunction
                  - cloudfront:TagResource
                  - cloudfront:UpdateDistribution
                  - cloudfront:UpdateFunction
                  - cloudfront:UpdateOriginAccessControl
                Resource: '*'

Outputs:
  DeployRoleArn:
    Description: Set this as GitHub secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
